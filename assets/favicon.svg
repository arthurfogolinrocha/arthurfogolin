<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="af-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Cybernetic Dark Base Container with Smooth Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#02040a" stroke="url(#border-grad)" stroke-width="2.5"/>

  <!-- Subtle Cyber Grid Background Lines -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="rgba(0,240,255,0.15)" stroke-width="0.8"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="rgba(168,85,247,0.15)" stroke-width="0.8"/>

  <!-- High-Tech Geometric AF Monogram -->
  <!-- Letter A -->
  <path d="M13 47 L22.5 17 L29.5 17 L39 47 L32.5 47 L30.2 39 L21.8 39 L19.5 47 Z M23.5 33.5 L28.5 33.5 L26 24 Z" fill="url(#af-grad)" filter="url(#glow)"/>

  <!-- Letter F (Interlocked Cyber Style) -->
  <path d="M36.5 17 L51 17 L51 23.5 L43.5 23.5 L43.5 30 L49.5 30 L49.5 36.5 L43.5 36.5 L43.5 47 L36.5 47 Z" fill="url(#af-grad)" filter="url(#glow)"/>

  <!-- Glowing Quantum Core Pulse Point -->
  <circle cx="51" cy="17" r="2.8" fill="#00f0ff" filter="url(#glow)"/>
  <circle cx="13" cy="47" r="1.8" fill="#a855f7"/>
</svg>